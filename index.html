<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="description" content="A simple offline-first running ledger for tracking petty cash in and out.">
<meta name="theme-color" content="#2a2620">
<title>Petty Cash Ledger</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">

<style>
  :root{
    --paper:#f6f3ec;
    --ink:#2a2620;
    --ink-soft:#6b6455;
    --rule:#d8d2c2;
    --green:#3d6b52;
    --green-deep:#2c4d3c;
    --rust:#a4462c;
    --card:#fffdf7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Georgia', 'Iowan Old Style', serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:90px;
  }
  header{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--rule);
    background:
      repeating-linear-gradient(180deg, transparent 0 27px, var(--rule) 27px 28px);
  }
  header .eyebrow{
    font-family:ui-monospace,'SF Mono',Menlo,monospace;
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  header h1{
    font-size:26px;
    margin:2px 0 14px;
    font-weight:400;
    font-style:italic;
  }
  .balance-line{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .balance-line .amt{
    font-size:38px;
    font-weight:700;
    font-family:'Georgia',serif;
    letter-spacing:-0.5px;
  }
  .balance-line .amt.neg{color:var(--rust);}
  .balance-line .meta{
    text-align:right;
    font-family:ui-monospace,monospace;
    font-size:11px;
    color:var(--ink-soft);
    line-height:1.5;
  }

  main{padding:16px 20px;max-width:520px;margin:0 auto;}

  .entry-form{
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:2px;
    padding:16px;
    margin-bottom:22px;
    box-shadow:0 1px 0 var(--rule);
  }
  .type-toggle{
    display:flex;
    border:1px solid var(--ink);
    border-radius:3px;
    overflow:hidden;
    margin-bottom:14px;
    font-family:ui-monospace,monospace;
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .type-toggle button{
    flex:1;padding:10px 0;background:transparent;border:none;color:var(--ink);
    font-family:inherit;font-size:inherit;letter-spacing:inherit;cursor:pointer;
  }
  .type-toggle button.active.out{background:var(--rust);color:#fff;}
  .type-toggle button.active.in{background:var(--green);color:#fff;}

  .field{margin-bottom:12px;}
  .field label{
    display:block;font-family:ui-monospace,monospace;font-size:10px;
    text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);margin-bottom:5px;
  }
  .field input, .field select, .field textarea{
    width:100%;border:none;border-bottom:1px solid var(--rule);
    background:transparent;font-family:'Georgia',serif;font-size:16px;
    padding:6px 2px;color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none;border-bottom:1.5px solid var(--ink);
  }
  .amount-row{display:flex;align-items:center;gap:4px;}
  .amount-row .currency{font-size:16px;color:var(--ink-soft);}
  textarea{resize:vertical;min-height:38px;font-size:14px !important;}

  .save-btn{
    width:100%;padding:13px;border:none;border-radius:3px;
    font-family:ui-monospace,monospace;font-size:12px;letter-spacing:1.5px;
    text-transform:uppercase;color:#fff;cursor:pointer;margin-top:4px;
  }
  .save-btn.out{background:var(--rust);}
  .save-btn.in{background:var(--green);}

  .ledger-head{
    display:flex;justify-content:space-between;align-items:center;
    margin:26px 0 10px;
  }
  .ledger-head h2{
    font-size:11px;font-family:ui-monospace,monospace;text-transform:uppercase;
    letter-spacing:2px;color:var(--ink-soft);margin:0;
  }
  .export-link{
    font-family:ui-monospace,monospace;font-size:10px;letter-spacing:1px;
    color:var(--green-deep);text-decoration:underline;background:none;border:none;
    cursor:pointer;text-transform:uppercase;
  }

  .entry{
    display:grid;
    grid-template-columns:1fr auto auto;
    gap:2px 12px;
    padding:12px 0;
    border-bottom:1px solid var(--rule);
    align-items:start;
  }
  .entry .desc{font-size:15px;}
  .entry .amt{
    font-family:ui-monospace,monospace;font-size:15px;font-weight:600;text-align:right;
  }
  .entry .amt.in{color:var(--green-deep);}
  .entry .amt.out{color:var(--rust);}
  .entry .note{
    grid-column:1 / -1;
    font-size:13px;color:var(--ink-soft);font-style:italic;
    margin-top:2px;
  }
  .entry .sub{
    grid-column:1 / -1;
    font-family:ui-monospace,monospace;font-size:10px;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:0.5px;margin-top:1px;
    display:flex;align-items:center;gap:8px;
  }
  .entry .receipt-thumb{
    width:34px;height:34px;object-fit:cover;border:1px solid var(--rule);
    border-radius:2px;cursor:pointer;flex-shrink:0;
  }
  .delete-btn{
    background:none;border:none;color:var(--ink-soft);cursor:pointer;
    font-size:18px;line-height:1;padding:2px 4px;font-family:ui-monospace,monospace;
    align-self:start;
  }
  .delete-btn:hover{color:var(--rust);}
  .empty{
    text-align:center;color:var(--ink-soft);font-style:italic;
    padding:40px 0;font-size:14px;
  }

  .receipt-field{margin-bottom:12px;}
  .receipt-btn{
    display:inline-flex;align-items:center;gap:6px;
    background:transparent;border:1px solid var(--rule);border-radius:3px;
    padding:8px 12px;font-family:ui-monospace,monospace;font-size:11px;
    letter-spacing:0.5px;text-transform:uppercase;color:var(--ink-soft);cursor:pointer;
  }
  .receipt-preview{
    display:flex;align-items:center;gap:10px;margin-top:8px;
  }
  .receipt-preview img{
    width:56px;height:56px;object-fit:cover;border:1px solid var(--rule);border-radius:2px;
  }
  .receipt-preview button{
    background:none;border:none;color:var(--rust);font-family:ui-monospace,monospace;
    font-size:11px;text-transform:uppercase;letter-spacing:0.5px;cursor:pointer;
    text-decoration:underline;
  }

  .lightbox{
    position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;
    align-items:center;justify-content:center;z-index:2000;padding:20px;
  }
  .lightbox.show{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:2px;}

  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block;position:absolute;left:0;top:0;width:100%;padding:20px;}
    #printArea table{width:100%;border-collapse:collapse;font-size:12px;}
    #printArea th, #printArea td{border:1px solid #999;padding:6px 8px;text-align:left;}
    #printArea h1{font-size:20px;margin-bottom:4px;}
    #printArea .print-summary{margin-bottom:16px;font-family:ui-monospace,monospace;font-size:12px;}
  }

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:20px;
    font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.5px;
    opacity:0;transition:all 0.25s ease;pointer-events:none;
    max-width:80vw;text-align:center;z-index:1000;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <div class="eyebrow">Running Ledger</div>
  <h1>Petty Cash</h1>
  <div class="balance-line">
    <div class="amt" id="balanceAmt">$0.00</div>
    <div class="meta" id="balanceMeta">0 in · 0 out</div>
  </div>
</header>

<main>
  <div class="entry-form">
    <div class="type-toggle">
      <button id="btnOut" class="active out">Money Out</button>
      <button id="btnIn" class="in">Money In</button>
    </div>

    <div class="field amount-row">
      <span class="currency">$</span>
      <input type="number" id="fAmount" inputmode="decimal" placeholder="0.00" step="0.01">
    </div>

    <div class="field">
      <label id="lblSource">Category</label>
      <select id="fSource"></select>
    </div>

    <div class="field">
      <label id="lblParty">Paid to</label>
      <input type="text" id="fParty" placeholder="Name or business">
    </div>

    <div class="field">
      <label>Note</label>
      <textarea id="fNote" placeholder="e.g. reimbursed by Sarah, or reference number"></textarea>
    </div>

    <div class="receipt-field">
      <label style="display:block;font-family:ui-monospace,monospace;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);margin-bottom:5px;">Receipt</label>
      <button type="button" class="receipt-btn" id="btnReceipt">📷 Snap receipt</button>
      <input type="file" id="fReceipt" accept="image/*" capture="environment" style="display:none;">
      <div class="receipt-preview" id="receiptPreview" style="display:none;">
        <img id="receiptPreviewImg" alt="Receipt preview">
        <button type="button" id="btnRemoveReceipt">Remove</button>
      </div>
    </div>

    <button class="save-btn out" id="btnSave">Save Entry</button>
  </div>

  <div class="ledger-head">
    <h2>Entries</h2>
    <div>
      <button class="export-link" id="btnExport">Export CSV</button>
      <button class="export-link" id="btnExportPdf">Export PDF</button>
    </div>
  </div>

  <div id="entryList"></div>
  <div class="empty" id="emptyState" style="display:none;">No entries yet. Add your first one above.</div>
</main>

<div class="toast" id="toast"></div>

<div class="lightbox" id="lightbox">
  <img id="lightboxImg" alt="Receipt">
</div>

<div id="printArea">
  <h1>Petty Cash Ledger</h1>
  <div class="print-summary" id="printSummary"></div>
  <table>
    <thead>
      <tr><th>Date</th><th>Type</th><th>Amount</th><th>Category/Source</th><th>Party</th><th>Note</th></tr>
    </thead>
    <tbody id="printTableBody"></tbody>
  </table>
</div>

<script>
const STORAGE_KEY = 'ledger-entries';
const OUT_CATEGORIES = ['Supplies','Travel','Meals','Postage','Cleaning','Repairs','Misc'];
const IN_CATEGORIES = ['Owner top-up','Refund','Sale proceeds','Reimbursement','Other'];

let currentType = 'out';
let entries = [];
let pendingReceipt = null;

const fSource = document.getElementById('fSource');
const btnOut = document.getElementById('btnOut');
const btnIn = document.getElementById('btnIn');
const btnSave = document.getElementById('btnSave');
const lblSource = document.getElementById('lblSource');
const lblParty = document.getElementById('lblParty');
const btnReceipt = document.getElementById('btnReceipt');
const fReceipt = document.getElementById('fReceipt');
const receiptPreview = document.getElementById('receiptPreview');
const receiptPreviewImg = document.getElementById('receiptPreviewImg');
const btnRemoveReceipt = document.getElementById('btnRemoveReceipt');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');

function populateCategories(){
  const list = currentType === 'out' ? OUT_CATEGORIES : IN_CATEGORIES;
  fSource.innerHTML = list.map(c => `<option value="${c}">${c}</option>`).join('');
}

function setType(type){
  currentType = type;
  btnOut.classList.toggle('active', type === 'out');
  btnIn.classList.toggle('active', type === 'in');
  btnSave.classList.toggle('out', type === 'out');
  btnSave.classList.toggle('in', type === 'in');
  lblSource.textContent = type === 'out' ? 'Category' : 'Source';
  lblParty.textContent = type === 'out' ? 'Paid to' : 'Received from';
  populateCategories();
}

btnOut.addEventListener('click', () => setType('out'));
btnIn.addEventListener('click', () => setType('in'));

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

function fmt(n){
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toFixed(2);
}

function render(){
  let balance = 0;
  let inCount = 0, outCount = 0;
  const list = document.getElementById('entryList');
  const empty = document.getElementById('emptyState');

  const sorted = [...entries].sort((a,b) => b.ts - a.ts);
  list.innerHTML = '';

  // compute running balance chronologically
  const chronological = [...entries].sort((a,b) => a.ts - b.ts);
  chronological.forEach(e => {
    balance += e.type === 'in' ? e.amount : -e.amount;
    if(e.type === 'in') inCount++; else outCount++;
  });

  document.getElementById('balanceAmt').textContent = fmt(balance);
  document.getElementById('balanceAmt').classList.toggle('neg', balance < 0);
  document.getElementById('balanceMeta').textContent = `${inCount} in · ${outCount} out`;

  if(sorted.length === 0){
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  sorted.forEach(e => {
    const div = document.createElement('div');
    div.className = 'entry';
    div.dataset.id = e.id;
    const dateStr = new Date(e.ts).toLocaleDateString(undefined, {month:'short', day:'numeric'});
    div.innerHTML = `
      <div class="desc">${e.source}${e.party ? ' — ' + escapeHtml(e.party) : ''}</div>
      <div class="amt ${e.type}">${e.type === 'in' ? '+' : '−'}${fmt(e.amount).replace('-','')}</div>
      <button class="delete-btn" data-id="${e.id}" aria-label="Delete entry" title="Delete entry">×</button>
      <div class="sub">
        ${e.receipt ? `<img class="receipt-thumb" src="${e.receipt}" data-id="${e.id}" alt="Receipt thumbnail">` : ''}
        <span>${dateStr}</span>
      </div>
      ${e.note ? `<div class="note">"${escapeHtml(e.note)}"</div>` : ''}
    `;
    list.appendChild(div);
  });
}

function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function loadEntries(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    entries = raw ? JSON.parse(raw) : [];
  }catch(e){
    entries = [];
  }
  render();
}

function saveEntries(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    return true;
  }catch(e){
    return false;
  }
}

document.getElementById('btnSave').addEventListener('click', () => {
  const amount = parseFloat(document.getElementById('fAmount').value);
  const source = fSource.value;
  const party = document.getElementById('fParty').value.trim();
  const note = document.getElementById('fNote').value.trim();

  if(!amount || amount <= 0){
    showToast('Enter a valid amount');
    return;
  }

  entries.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    type: currentType,
    amount,
    source,
    party,
    note,
    receipt: pendingReceipt,
    ts: Date.now()
  });

  if(!saveEntries()){
    entries.pop();
    showToast('Storage full — try a smaller receipt photo or delete old entries');
    return;
  }

  render();
  showToast(currentType === 'in' ? 'Money in saved' : 'Money out saved');

  document.getElementById('fAmount').value = '';
  document.getElementById('fParty').value = '';
  document.getElementById('fNote').value = '';
  clearPendingReceipt();
});

document.getElementById('entryList').addEventListener('click', (e) => {
  const delBtn = e.target.closest('.delete-btn');
  if(delBtn){
    const id = delBtn.dataset.id;
    if(confirm('Delete this entry? This cannot be undone.')){
      entries = entries.filter(entry => entry.id !== id);
      saveEntries();
      render();
      showToast('Entry deleted');
    }
    return;
  }
  const thumb = e.target.closest('.receipt-thumb');
  if(thumb){
    lightboxImg.src = thumb.src;
    lightbox.classList.add('show');
  }
});

lightbox.addEventListener('click', () => {
  lightbox.classList.remove('show');
  lightboxImg.src = '';
});

function clearPendingReceipt(){
  pendingReceipt = null;
  fReceipt.value = '';
  receiptPreview.style.display = 'none';
  receiptPreviewImg.src = '';
}

btnReceipt.addEventListener('click', () => fReceipt.click());

btnRemoveReceipt.addEventListener('click', clearPendingReceipt);

fReceipt.addEventListener('change', () => {
  const file = fReceipt.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 1000;
      let { width, height } = img;
      if(width > maxDim || height > maxDim){
        const scale = maxDim / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      pendingReceipt = canvas.toDataURL('image/jpeg', 0.7);
      receiptPreviewImg.src = pendingReceipt;
      receiptPreview.style.display = 'flex';
    };
    img.src = reader.result;
  };
  reader.onerror = () => showToast('Could not read photo');
  reader.readAsDataURL(file);
});

document.getElementById('btnExport').addEventListener('click', () => {
  if(entries.length === 0){
    showToast('Nothing to export yet');
    return;
  }
  const rows = [['Date','Type','Amount','Category/Source','Party','Note']];
  [...entries].sort((a,b) => a.ts - b.ts).forEach(e => {
    rows.push([
      new Date(e.ts).toISOString().slice(0,10),
      e.type === 'in' ? 'Money In' : 'Money Out',
      e.amount.toFixed(2),
      e.source,
      e.party,
      e.note
    ]);
  });
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'petty-cash-ledger.csv';
  a.click();
  URL.revokeObjectURL(url);
  showToast('CSV downloaded');
});

document.getElementById('btnExportPdf').addEventListener('click', () => {
  if(entries.length === 0){
    showToast('Nothing to export yet');
    return;
  }

  let balance = 0, inCount = 0, outCount = 0;
  const chronological = [...entries].sort((a,b) => a.ts - b.ts);
  chronological.forEach(e => {
    balance += e.type === 'in' ? e.amount : -e.amount;
    if(e.type === 'in') inCount++; else outCount++;
  });

  document.getElementById('printSummary').textContent =
    `Balance: ${fmt(balance)}  ·  ${inCount} in · ${outCount} out  ·  Generated ${new Date().toLocaleString()}`;

  const tbody = document.getElementById('printTableBody');
  tbody.innerHTML = chronological.map(e => `
    <tr>
      <td>${new Date(e.ts).toISOString().slice(0,10)}</td>
      <td>${e.type === 'in' ? 'Money In' : 'Money Out'}</td>
      <td>${fmt(e.amount)}</td>
      <td>${escapeHtml(e.source)}</td>
      <td>${escapeHtml(e.party)}</td>
      <td>${escapeHtml(e.note)}</td>
    </tr>
  `).join('');

  window.print();
});

setType('out');
loadEntries();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>

</body>
</html>
